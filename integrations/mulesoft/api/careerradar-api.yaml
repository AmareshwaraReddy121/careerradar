# Generated from the Express routes in apps/api; keep in sync when routes change.
openapi: 3.0.3
info:
  title: CareerRadar API
  version: 1.0.0
  description:
    'Public REST API of CareerRadar, published through the MuleSoft gateway. Register this
    spec in Anypoint Exchange and manage it with API Manager.

    '
  license:
    name: Proprietary
    url: https://github.com/AmareshwaraReddy121/careerradar
servers:
  - url: http://localhost:8081/api/v1
    description: Local Mule gateway
  - url: http://localhost:4000/api/v1
    description: Backend (direct, development only)
tags:
  - name: system
    description: Health and readiness
  - name: auth
    description: Sign-up, sign-in and session management
  - name: me
    description: Current account
  - name: profile
    description: Candidate profile
  - name: meta
    description: Reference data
  - name: dashboard
    description: Dashboard summary
  - name: admin
    description: Administration (admin role)
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags:
        - system
      security: []
      summary: Liveness
      responses:
        '200':
          $ref: '#/components/responses/Ok'
      operationId: getHealth
  /ready:
    get:
      tags:
        - system
      security: []
      summary: Readiness (database connected)
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '503':
          $ref: '#/components/responses/Error'
      operationId: getReady
  /auth/register:
    post:
      tags:
        - auth
      security: []
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          $ref: '#/components/responses/Auth'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      operationId: postAuthRegister
  /auth/login:
    post:
      tags:
        - auth
      security: []
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          $ref: '#/components/responses/Auth'
        '401':
          $ref: '#/components/responses/Error'
      operationId: postAuthLogin
  /auth/refresh:
    post:
      tags:
        - auth
      security:
        - refreshCookie: []
      summary: Rotate the refresh cookie and issue a new access token
      responses:
        '200':
          $ref: '#/components/responses/Auth'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      operationId: postAuthRefresh
  /auth/logout:
    post:
      tags:
        - auth
      security:
        - refreshCookie: []
      summary: Revoke the current refresh token
      responses:
        '204':
          description: Signed out
      operationId: postAuthLogout
  /auth/verify-email:
    post:
      tags:
        - auth
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Token'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/Error'
      operationId: postAuthVerifyEmail
      summary: POST /auth/verify-email
  /auth/resend-verification:
    post:
      tags:
        - auth
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/Error'
      operationId: postAuthResendVerification
      summary: POST /auth/resend-verification
  /auth/forgot-password:
    post:
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          $ref: '#/components/responses/Ok'
      operationId: postAuthForgotPassword
      summary: POST /auth/forgot-password
  /auth/reset-password:
    post:
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/Error'
      operationId: postAuthResetPassword
      summary: POST /auth/reset-password
  /me:
    get:
      tags:
        - me
      summary: Current user
      responses:
        '200':
          $ref: '#/components/responses/User'
        '401':
          $ref: '#/components/responses/Error'
      operationId: getMe
    delete:
      tags:
        - me
      summary: Permanently delete the account
      responses:
        '204':
          description: Deleted
      operationId: deleteMe
  /me/password:
    post:
      tags:
        - me
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '200':
          $ref: '#/components/responses/Auth'
        '400':
          $ref: '#/components/responses/Error'
      operationId: postMePassword
      summary: POST /me/password
  /me/notification-preferences:
    put:
      tags:
        - me
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPrefs'
      responses:
        '200':
          $ref: '#/components/responses/User'
      operationId: putMeNotificationPreferences
      summary: PUT /me/notification-preferences
  /me/export:
    get:
      tags:
        - me
      summary: Export all personal data
      responses:
        '200':
          $ref: '#/components/responses/Ok'
      operationId: getMeExport
  /profile:
    get:
      tags:
        - profile
      responses:
        '200':
          $ref: '#/components/responses/Profile'
      operationId: getProfile
      summary: GET /profile
    put:
      tags:
        - profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/Profile'
        '400':
          $ref: '#/components/responses/Error'
      operationId: putProfile
      summary: PUT /profile
  /profile/sensitive:
    get:
      tags:
        - profile
      summary: Optional eligibility details (decrypted for the owner)
      responses:
        '200':
          $ref: '#/components/responses/Ok'
      operationId: getProfileSensitive
    put:
      tags:
        - profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - consent
              properties:
                consent:
                  type: boolean
                  enum:
                    - true
                category:
                  type: string
                  nullable: true
                pwbd:
                  type: boolean
                  nullable: true
                exServiceman:
                  type: boolean
                  nullable: true
                gender:
                  type: string
                  nullable: true
                nationality:
                  type: string
                  nullable: true
                domicileState:
                  type: string
                  nullable: true
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/Error'
      operationId: putProfileSensitive
      summary: PUT /profile/sensitive
    delete:
      tags:
        - profile
      summary: Withdraw consent and erase eligibility details
      responses:
        '204':
          description: Erased
      operationId: deleteProfileSensitive
  /meta/taxonomies:
    get:
      tags:
        - meta
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
      operationId: getMetaTaxonomies
      summary: GET /meta/taxonomies
  /dashboard/summary:
    get:
      tags:
        - dashboard
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
      operationId: getDashboardSummary
      summary: GET /dashboard/summary
  /admin/users:
    get:
      tags:
        - admin
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '403':
          $ref: '#/components/responses/Error'
      operationId: getAdminUsers
      summary: GET /admin/users
  /admin/users/{id}:
    patch:
      tags:
        - admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum:
                    - user
                    - moderator
                    - admin
                status:
                  type: string
                  enum:
                    - active
                    - suspended
                    - deleted
      responses:
        '200':
          $ref: '#/components/responses/User'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      operationId: patchAdminUsersId
      summary: PATCH /admin/users/{id}
  /admin/audit-logs:
    get:
      tags:
        - admin
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '403':
          $ref: '#/components/responses/Error'
      operationId: getAdminAuditLogs
      summary: GET /admin/audit-logs
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: cr_refresh
  requestBodies:
    Token:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - token
            properties:
              token:
                type: string
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  message:
                    type: string
    RegisterInput:
      type: object
      required:
        - fullName
        - email
        - password
        - acceptTerms
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        acceptTerms:
          type: boolean
          enum:
            - true
    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    NotificationPrefs:
      type: object
      required:
        - channels
        - topics
        - digest
      properties:
        channels:
          type: object
          properties:
            inApp:
              type: boolean
            email:
              type: boolean
            push:
              type: boolean
        topics:
          type: object
          additionalProperties:
            type: boolean
        digest:
          type: string
          enum:
            - instant
            - daily
            - weekly
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
            - user
            - moderator
            - admin
        status:
          type: string
        emailVerified:
          type: boolean
        notificationPrefs:
          $ref: '#/components/schemas/NotificationPrefs'
        createdAt:
          type: string
          format: date-time
  responses:
    Ok:
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Auth:
      description: Access token and user; sets the cr_refresh cookie
      content:
        application/json:
          schema:
            type: object
            properties:
              accessToken:
                type: string
              user:
                $ref: '#/components/schemas/User'
    User:
      description: User
      content:
        application/json:
          schema:
            type: object
            properties:
              user:
                $ref: '#/components/schemas/User'
    Profile:
      description: Profile
      content:
        application/json:
          schema:
            type: object
            properties:
              profile:
                type: object
                additionalProperties: true
